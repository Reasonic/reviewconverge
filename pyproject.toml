[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewconverge"
version = "0.0.1"
description = "A convergence benchmark and workflow standard for iterative agentic review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ReviewConverge authors" }]
keywords = ["llm", "agents", "review", "convergence", "benchmark", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]
dependencies = [
    # Runtime deps are pinned as modules land (M2+). Kept minimal on purpose.
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/OWNER/reviewconverge"
Issues = "https://github.com/OWNER/reviewconverge/issues"

[tool.setuptools.packages.find]
include = ["reviewconverge*"]

[tool.ruff]
line-length = 100
